<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/modal.css">
    <link rel="stylesheet" href="./css/carousel.css">
    <style>
        main { padding: 20px; text-align: center; }
        .descripcion { margin-bottom: 30px; }
        .descripcion img { width: 150px; cursor: pointer; }
        .carousel-container { margin-top: 30px; }
    </style>
</head>
<body>

<header>
    <nav id="header">
        <img src="./img/logo.png" alt="Logo" id="logo" height="40" width="60">
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="proyectos.html">Proyectos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
        <div class="burger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>
</header>

<main>
    <!-- Carrusel de proyectos -->
    <section class="carousel-container">
    <div class="carousel">
        <button class="prev">&#10094;</button>
        <div class="carousel-track">
            <img src="https://media.tenor.com/sELLevx25fUAAAAe/simpsons-smoking.png" alt="Proyecto 1">
            <img src="https://media.forgecdn.net/avatars/thumbnails/1138/934/256/256/638701627221888809.png" alt="Proyecto 2">
            <img src="https://media.forgecdn.net/avatars/thumbnails/1247/598/256/256/638814636995904161.png" alt="Proyecto 3">
            <img src="./img/mt.png" alt="Proyecto 4">
            <img src="https://w7.pngwing.com/pngs/51/36/png-transparent-rubber-stamp-coming-soon-miscellaneous-text-label-thumbnail.png" alt="Proyecto 5">
        </div>
        <button class="next">&#10095;</button>
    </div>
    <div class="carousel-indicators"></div>
</section>
    <!-- Sección de descripción -->
    <section class="descripcion">
        <h1 class="dd">Descripción</h1>
        <p>Bienvenido a mi portafolio. Descubre mis proyectos y habilidades aquí.</p>
        <img id="descripcionImg" src="./img/logo.png" alt="Imagen Descripción">
    </section>

    
</main>

<footer>
    <div class="social-icons">
        <a href="#" target="_blank">Instagram</a>
        <a href="#" target="_blank">LinkedIn</a>
        <a href="#" target="_blank">GitHub</a>
    </div>
</footer>

<!-- Modal de la imagen de descripción -->
<div id="descripcionModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img src="./img/logo.png" alt="Imagen Ampliada">
        <h2>Sobre Mí</h2>
        <p>Hola, soy SrNadien, desarrollador web y creador de proyectos innovadores.</p>
    </div>
</div>

<!-- Botones flotantes -->
<a href="https://wa.me/5492615172689" class="whatsapp-float" target="_blank" title="Chatea con nosotros por WhatsApp">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/WhatsApp_icon.png" alt="Icono de WhatsApp" />
</a>
<button id="scrollTop" class="scroll-top">↑</button>

<script>
    // Modal
    const modal = document.getElementById("descripcionModal");
    const img = document.getElementById("descripcionImg");
    const span = document.querySelector(".modal .close");

    img.onclick = function() {
        modal.style.display = "block";
    }

    span.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if(event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>
<script src="./js/script.js"></script>
<script src="./js/carusel.js"></script>
</body>
</html>
