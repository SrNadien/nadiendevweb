<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NadienDev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0b0b0b;
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            width: 60px;
            height: 60px;
            border: 2px solid #00ff88;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 15px;
            position: relative;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00ff88;
        }

        nav a.active::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 2px;
            background: #00ff88;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 0 60px;
        }

        .hero-text h1 {
            font-size: 64px;
            font-weight: 800;
        }

        .hero-text p {
            margin-top: 15px;
            font-size: 22px;
            color: #ccc;
        }

        .hero-image {
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .hero-image img {
            max-height: 85vh;
            opacity: 0.9;
        }

        /* ===== SOCIAL ===== */
        .social {
            position: absolute;
            left: 30px;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .social a {
            color: #fff;
            font-size: 18px;
            transition: 0.3s;
        }

        .social a:hover {
            color: #00ff88;
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-image {
                display: none;
            }

            header {
                padding: 20px 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img src="./images/logo.png" alt="NadienDev Logo">
    </div>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="proyectos.html" class="active">Proyectos</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<div class="social">
    <a href="https://github.com/SrNadien" target="_blank"><i class="fab fa-github"></i></a>
    <a href="https://x.com/kingnadien" target="_blank"><i class="fab fa-twitter"></i></a>
    <a href="https://discord.gg/E3yj2chy6R" target="_blank"><i class="fa-brands fa-discord"></i></a>
</div>

<section class="hero">
    <div class="hero-text">
        <h1>NadienDev</h1>
        <p>Tu Desarrollador De Confianza</p>
    </div>

    <div class="hero-image">
        <img src="./images/logo.png" alt="NadienDev">
    </div>
</section>

</body>
</html>
