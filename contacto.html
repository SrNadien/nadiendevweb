<script >
    document.addEventListener('DOMContentLoaded', () => {

    // 1. Funcionalidad del Menú de Navegación (Hamburguesa)
    const navSlide = () => {
        const burger = document.querySelector('.burger');
        const nav = document.querySelector('.nav-links');
        const navLinks = document.querySelectorAll('.nav-links li');

        if (burger && nav && navLinks) {
            burger.addEventListener('click', () => {
                // Alternar la clase 'nav-active' en el menú de navegación
                nav.classList.toggle('nav-active');

                // Animar los enlaces del menú
                navLinks.forEach((link, index) => {
                    if (link.style.animation) {
                        link.style.animation = '';
                    } else {
                        link.style.animation = `navLinkFade 0.5s ease forwards ${index / 7 + 0.5}s`;
                    }
                });

                // Alternar la animación de la hamburguesa
                burger.classList.toggle('toggle');
            });
        }
    };
    navSlide();

    // 2. Funcionalidad del Botón "Volver Arriba"
    const setupScrollToTop = () => {
        const scrollTopBtn = document.getElementById('scrollTop');

        if (scrollTopBtn) {
            // Muestra/oculta el botón al hacer scroll
            window.addEventListener('scroll', () => {
                // El botón se muestra después de 200px de scroll
                if (window.scrollY > 200) {
                    scrollTopBtn.style.display = 'block';
                } else {
                    scrollTopBtn.style.display = 'none';
                }
            });

            // Agrega la funcionalidad de clic al botón
            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth' // Desplazamiento suave
                });
            });
        }
    };
    setupScrollToTop();
});
</script>
