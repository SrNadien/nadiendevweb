<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> NadienDev - Contacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border: 2px solid #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 5px;
            background: rgba(0,0,0,0.5);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
            position: relative;
        }

        nav a:hover,
        nav a.active {
            color: #00ff88;
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00ff88;
        }

        .contact-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 50px;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .contact-header p {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .contact-header h1 {
            font-size: 48px;
            position: relative;
            display: inline-block;
        }

        .contact-header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00ff88;
        }

        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            margin-top: 60px;
        }

        .message-section h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            padding: 12px 0;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-bottom-color: #00ff88;
        }

        input::placeholder, textarea::placeholder {
            color: #666;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .send-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: #00cc6f;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .contact-info h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .contact-info p {
            color: #888;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 255, 136, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff88;
            flex-shrink: 0;
        }

        .info-content h3 {
            font-size: 16px;
            margin-bottom: 5px;
            color: #fff;
        }

        .info-content p {
            color: #888;
            margin: 0;
        }

        .info-content a {
            color: #00ff88;
            text-decoration: none;
        }

        @media (max-width: 968px) {
            .contact-content {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px 20px;
            }

            nav {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <div class="logo">
            <img src="images/logo.png" alt="NadienDev Logo">
        </div>
    </div>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="proyectos.html" class="active">Proyectos</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<div class="contact-container">
    <div class="contact-header">
        <p>Ponerse en contacto</p>
        <h1>Contacto</h1>
    </div>

    <div class="contact-content">
        <div class="message-section">
            <h2>Message Me</h2>

            <form action="https://formspree.io/f/xnjjqqjn" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" name="name" placeholder="Nombre" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Correo" required>
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" name="subject" placeholder="Asunto" required>
                </div>

                <div class="form-group">
                    <textarea name="message" placeholder="Mensaje" required></textarea>
                </div>

                <input type="hidden" name="_redirect" value="contact.html?sent=true">

                <button type="submit" class="send-btn">Send Message</button>
            </form>
        </div>

        <div class="contact-info">
            <h2>Contact Information</h2>
            <p>Open for opportunities. Let's connect and build something awesome together!</p>

            <div class="info-item">
                <div class="info-content">
                    <h3>Name</h3>
                    <p>NadienDev</p>
                </div>
            </div>

            <div class="info-item">
                <div class="info-content">
                    <h3>Location</h3>
                    <p>Buenos Aires, Argentina</p>
                </div>
            </div>

            <div class="info-item">
                <div class="info-content">
                    <h3>Email</h3>
                    <p><a href="mailto:nadiende@gmail.com">nadiende@gmail.com</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
